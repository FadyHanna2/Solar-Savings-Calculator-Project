<!DOCTYPE html>
<html>
<head>
    <title>Solar System Information</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="calculator-card">

        <p class="small-title">SOLAR SAVINGS CALCULATOR</p>

        <h1>Solar system information</h1>

        <p class="description">
            Enter your solar system size and choose the panel direction and tilt.
        </p>

        <form method="POST" onsubmit="return validateSystemSize()">

            <label for="system_size">Solar system size</label>

            <div class="input-box">
                <input
                    type="number"
                    step="any"
                    id="system_size"
                    name="system_size"
                    placeholder="8.5"
                    value="{{ system_size if system_size is not none else '' }}"
                >
                <span>kW</span>
            </div>

            <p class="error-text" id="size_error"></p>

            <p class="help-text">
                Enter the size of your solar system in kW.
            </p>

            <label for="panel_direction">Panel direction</label>

            <div class="input-box">
                <select id="panel_direction" name="panel_direction">
                    <option value="">Choose direction</option>
                    <option value="North" {% if panel_direction == "North" %}selected{% endif %}>North</option>
                    <option value="Northeast" {% if panel_direction == "Northeast" %}selected{% endif %}>Northeast</option>
                    <option value="East" {% if panel_direction == "East" %}selected{% endif %}>East</option>
                    <option value="Southeast" {% if panel_direction == "Southeast" %}selected{% endif %}>Southeast</option>
                    <option value="South" {% if panel_direction == "South" %}selected{% endif %}>South</option>
                    <option value="Southwest" {% if panel_direction == "Southwest" %}selected{% endif %}>Southwest</option>
                    <option value="West" {% if panel_direction == "West" %}selected{% endif %}>West</option>
                    <option value="Northwest" {% if panel_direction == "Northwest" %}selected{% endif %}>Northwest</option>
                </select>
            </div>

            <p class="error-text" id="direction_error"></p>

            <label for="panel_tilt">Panel tilt</label>

            <div class="input-box">
                <select id="panel_tilt" name="panel_tilt">
                    <option value="">Choose tilt</option>
                    <option value="0" {% if panel_tilt == "0" %}selected{% endif %}>0°</option>
                    <option value="15" {% if panel_tilt == "15" %}selected{% endif %}>15°</option>
                    <option value="30" {% if panel_tilt == "30" %}selected{% endif %}>30°</option>
                    <option value="45" {% if panel_tilt == "45" %}selected{% endif %}>45°</option>
                    <option value="60" {% if panel_tilt == "60" %}selected{% endif %}>60°</option>
                </select>
            </div>

            <p class="error-text" id="tilt_error"></p>

            <button type="submit">
                Continue
            </button>

        </form>

    </div>
    
    <script>
        function validateSystemSize() {
            let systemSize = document.getElementById("system_size").value;
            let panelDirection = document.getElementById("panel_direction").value;
            let panelTilt = document.getElementById("panel_tilt").value;

            let sizeError = document.getElementById("size_error");
            let directionError = document.getElementById("direction_error");
            let tiltError = document.getElementById("tilt_error");

            sizeError.textContent = "";
            directionError.textContent = "";
            tiltError.textContent = "";

            let valid = true;

            if (
                systemSize === "" ||
                isNaN(systemSize) ||
                Number(systemSize) <= 0
            ) {
                sizeError.textContent = "Please enter a valid solar system size greater than 0.";
                valid = false;
            }

            if (panelDirection === "") {
                directionError.textContent = "Please choose a panel direction.";
                valid = false;
            }

            if (panelTilt === "") {
                tiltError.textContent = "Please choose a panel tilt.";
                valid = false;
            }

            return valid;
        }
    </script>

</body>
</html>
