<!DOCTYPE html>
<html>
<head>
    <title>Home Location</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="calculator-card">

        <p class="small-title">SOLAR SAVINGS CALCULATOR</p>

        <h1>Enter your home location</h1>

        <p class="description">
            Enter your home address so we can use the location later in the calculator.
        </p>

        <form>

            <label for="street_address">Street address</label>

            <div class="input-box">
                <input
                    type="text"
                    id="street_address"
                    name="street_address"
                    placeholder="123 Main Street"
                >
            </div>

            <label for="city">City</label>

            <div class="input-box">
                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Chicago"
                >
            </div>

            <label for="state">State</label>

            <div class="input-box">
                <input
                    type="text"
                    id="state"
                    name="state"
                    placeholder="IL"
                >
            </div>

            <label for="zip_code">ZIP code</label>

            <div class="input-box">
                <input
                    type="text"
                    id="zip_code"
                    name="zip_code"
                    placeholder="60601"
                >
            </div>

            <button type="button">
                Continue
            </button>

        </form>

    </div>

</body>
</html>
