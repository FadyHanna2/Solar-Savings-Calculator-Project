<!DOCTYPE html>
<html>
<head>
    <title>Solar Payment Information</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="calculator-card">

        <p class="small-title">SOLAR SAVINGS CALCULATOR</p>

        <h1>Tell us about your solar payment</h1>

        <p class="description">
            Enter your estimated monthly solar payment and the yearly increase for your solar payment.
        </p>

        <form>

            <label for="solar_payment">Estimated monthly solar payment</label>

            <div class="input-box">
                <span>$</span>
                <input
                    type="number"
                    id="solar_payment"
                    name="solar_payment"
                    placeholder="100.00"
                >
            </div>

            <p class="error-text" id="solar_payment_error"></p>

            <p class="help-text">
                Enter the amount you expect to pay for solar each month.
            </p>


            <label for="solar_increase">Expected yearly solar increase</label>

            <div class="input-box">
                <input
                    type="number"
                    id="solar_increase"
                    name="solar_increase"
                    placeholder="2.9"
                >
                <span>%</span>
            </div>

            <p class="error-text" id="solar_increase_error"></p>

            <p class="help-text">
                For example, enter 2.9 for a 2.9% yearly increase.
            </p>
            

            <button type="button" onclick="validateSolarPayment()">
                Continue
            </button>

        </form>

    </div>

    <script>
        function validateSolarPayment() {
            let solarPayment = document.getElementById("solar_payment").value;
            let solarIncrease = document.getElementById("solar_increase").value;
    
            let paymentError = document.getElementById("solar_payment_error");
            let increaseError = document.getElementById("solar_increase_error");
    
            paymentError.textContent = "";
            increaseError.textContent = "";

            let valid = true;
    
            if (solarPayment === "" || isNaN(solarPayment) || Number(solarPayment) <= 0) {
                paymentError.textContent = "Please enter a valid monthly solar payment greater than $0.";
                valid = false;
            }
    
            if (solarIncrease === "" || isNaN(solarIncrease) || Number(solarIncrease) < 0) {
                increaseError.textContent = "Please enter a valid yearly solar increase.";
                valid = false;
            }

            return valid;
        }
    </script>

</body>
</html>
