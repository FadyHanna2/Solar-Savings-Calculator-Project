<!DOCTYPE html>
<html>
<head>
    <title>Comparison Years</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="calculator-card">

        <p class="small-title">SOLAR SAVINGS CALCULATOR</p>

        <h1>Choose comparison years</h1>

        <p class="description">
            Enter how many years you want to compare your electricity and solar costs.
        </p>

        <form>

            <label for="comparison_years">Number of years to compare</label>

            <div class="input-box">
                <input
                    type="number"
                    id="comparison_years"
                    name="comparison_years"
                    placeholder="20"
                >
            </div>

            <p class="error-text" id="years_error"></p>

            <p class="help-text">
                Enter the number of years you want to use for the savings comparison.
            </p>

            <button type="button" onclick="validateComparisonYears()">
                Continue to home location
            </button>

        </form>

    </div>

    <script>
        function validateComparisonYears() {
            let comparisonYears = document.getElementById("comparison_years").value;
            let yearsError = document.getElementById("years_error");
    
            yearsError.textContent = "";
    
            let valid = true;
    
            if (
                comparisonYears === "" ||
                isNaN(comparisonYears) ||
                Number(comparisonYears) <= 0 ||
                !Number.isInteger(Number(comparisonYears))
            ) {
                yearsError.textContent = "Please enter a valid whole number greater than 0.";
                valid = false;
            }
    
            return valid;
        }
    </script>

</body>
</html>
